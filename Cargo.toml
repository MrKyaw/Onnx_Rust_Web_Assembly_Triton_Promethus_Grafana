
[package]
name = "onnx-wasm-inference"
version = "0.1.0"
edition = "2021"
description = "ONNX inference in Rust/WebAssembly with a tested Triton gateway, Prometheus metrics and Grafana dashboards."
repository = "https://github.com/MrKyaw/Onnx_Rust_Web_Assembly_Triton_Promethus_Grafana"
license = "MIT"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
# Use specific versions that work together
tract-onnx = "0.18.5"  # Version known to work with WASM
wasm-bindgen = "0.2.84"
js-sys = "0.3.61"

# WASM-specific dependencies
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1.7"